name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install doctest
        run: sudo apt-get update && sudo apt-get install -y doctest-dev
      - name: Tests with AddressSanitizer + UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DOSCNET_SANITIZE=ON && cmake --build build-asan -j2
          ctest --test-dir build-asan --output-on-failure
      - name: Release build (make and CMake)
        run: |
          make all test
          cmake -S . -B build && cmake --build build -j2
      - name: Smoke runs
        run: |
          ./oscnet --n 20 --b 9 --eps 0.1 --tau 2 --kappa 0.5 --t 5 --out run.csv --every 50
          test "$(wc -l < run.csv)" -eq 102
          ./oscnet --topology file:examples/Kopplungsmatrix.txt --b 2 --eps 0.3 --t 5 --coupling legacy --tau 0.5 --kappa 1 --feedback legacy
          ./oscnet --n 20 --b 2 --b-spread 0.3 --normalize --init circle --t 10 --sweep eps:0:1:3

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff matplotlib
      - run: ruff check tools && ruff format --check tools
      - run: python tools/plot_sweep.py "all=results/sweep_all.csv" --out /tmp/sweep.png
